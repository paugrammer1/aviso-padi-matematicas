<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa PADI Matemáticas</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,Arial;background:#f8fafc;color:#172033}header{padding:15px 20px;background:#b91c1c;color:white}h1{font-size:1.25rem;margin:0}#map{height:72vh;min-height:380px}.info{padding:12px 20px}.leaflet-popup-content{max-height:240px;overflow:auto}small{color:#555}</style></head><body><header><h1>📍 PADI · Matemáticas</h1><div>Centros ofertados · Comunidad de Madrid</div></header><div id="map"></div><div class="info" id="resumen"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const centros=[{"centro": "IES DE GUADARRAMA", "localidad": "GUADARRAMA", "dat": "OESTE", "lat": 40.6653627, "lon": -4.0873158, "plazas": [{"jornada": "HORARIO COMPLETO EN UNA FUNCION", "tipo": "Sustitución", "causa": "LICENCIA POR MATRIMONIO", "fin": "2026-11-09", "observaciones": "Cargos: \nHorario: Mañana"}]}, {"centro": "IES MAESTRO JUAN MARIA LEONET", "localidad": "VILLA DEL PRADO", "dat": "SUR", "lat": 40.2716923, "lon": -4.3045781, "plazas": [{"jornada": "JORNADA_PARCIAL 1/2", "tipo": "Sustitución", "causa": "REDUCCION DE JORNADA, JORNADA A REALIZAR 1/2", "fin": "2027-06-30", "observaciones": "Turno diurno / Tanto la duración, como la jornada, pueden ser modificadas a petición de la titular."}]}];const pendientes=["CP INF-PRI-SEC JUAN DE GOYENECHE (NUEVO BAZTAN)", "IES GLORIA FUERTES (ALCOBENDAS)", "CP INF-PRI-SEC PUERTA DE LA SIERRA (VENTURADA)"];const map=L.map('map').setView([40.42,-3.70],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const puntos=[];for(const c of centros){let detalles=c.plazas.map((p,i)=>'<p><b>Plaza '+(i+1)+'</b><br>Jornada: '+esc(p.jornada)+'<br>Tipo: '+esc(p.tipo)+'<br>Causa: '+esc(p.causa)+'<br>Fin estimado: '+esc(p.fin)+(p.observaciones?'<br>Observaciones: '+esc(p.observaciones):'')+'</p>').join('');let m=L.marker([c.lat,c.lon]).addTo(map).bindPopup('<b>'+esc(c.centro)+'</b><br>'+esc(c.localidad)+' · DAT '+esc(c.dat)+'<hr>'+detalles);puntos.push(m.getLatLng())}if(puntos.length)map.fitBounds(L.latLngBounds(puntos).pad(.15),{maxZoom:12});document.getElementById('resumen').textContent=centros.length+' centros localizados · '+centros.reduce((n,c)=>n+c.plazas.length,0)+' plazas en el mapa'+(pendientes.length?' · Sin ubicación verificada: '+pendientes.join('; '):'');</script></body></html>
